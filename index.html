<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>surprise</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dab9fd 0%, #ffffff 45%, #d2b3f3 75%, #9937fa 100%);
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(147, 51, 234, 0.15);
    }

    h1 {
      color: #6b21a8;
      font-size: 1.6em;
      margin-bottom: 8px;
      font-weight: 400;
    }

    p.subtitle {
      color: #9333ea;
      margin-bottom: 28px;
      font-size: 0.95em;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid #d8b4fe;
      font-size: 1em;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      color: #4c1d95;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    }

    .error {
      color: #a855f7;
      font-size: 0.85em;
      margin-top: 10px;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .error.show {
      opacity: 1;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(107, 33, 168, 0.35);
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }

    .overlay.show {
      display: flex;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .letter {
      background: #fffaf5;
      border-radius: 4px;
      padding: 44px 38px;
      max-width: 1000px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 85vh;
      overflow-y: auto;
    }

    @keyframes pop {
      from {
        transform: scale(0.85);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .letter h2 {
      color: #be185d;
      font-weight: 400;
      text-align: center;
      margin-top: 0;
      font-size: 1.4em;
    }

    .letter p {
      color: #57534e;
      line-height: 1.8;
      font-size: 1.02em;
    }

    .signature {
      text-align: right;
      margin-top: 24px;
      font-style: italic;
      color: #be185d;
    }

    .close-btn {
      display: block;
      margin: 28px auto 0;
      background: #f9a8d4;
      color: #831843;
      border: none;
      padding: 10px 26px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9em;
      font-family: inherit;
    }

    .close-btn:hover {
      background: #f472b6;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Enter your name</h1>
    <p class="subtitle">just your name, nothing else</p>
    <input type="text" id="username" placeholder="Type here..." autocomplete="off">
    <div class="error" id="error">That's not quite the right name.</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="letter">
      <h2 id="letterHeading">My dearest,</h2>
      <div id="letterBody"></div>
      <div class="signature" id="letterSignature">— always yours</div>
      <button class="close-btn" id="closeBtn">close</button>
    </div>
  </div>

  <audio id="music" src="Minamahal.mp3" preload="auto"></audio>

  <script>
    // Add as many names as you like. Each key is the trigger name (lowercase),
    // and its value is that person's letter: heading, an array of paragraphs, and a signature.
  const names = ["irene", "battung"];
  const LETTER = {};

  for (const name of names) {
    LETTER[name] = {
      heading: `My dearest, ${name}`,
      paragraphs: [
        "Me doing this is a sign of my affection, using my own skills to show how much I adore you.",
        "My plan was to make this when I got the chance to meet your family, to make ones for them also, but I couldn't help it.",
        "The song you're listening to is titled 'Minamahal', a song I always wanted to devote to someone, the song that played in my head when I confessed my love to you.",
        "The part that played in my mind was 'huwag sanang matakot sa aaminin ko', my expectations were low, honestly I expected you to reject my confession since I thought you were not interested.",
        "The moment you told me that you accepted me, but was speechless, it made my day, I felt like the happiest man or boy in the world. No exaggeration.",
        "And the time you told me that you will tell your family about what happened, I was thrilled, nervous, expecting to be rejected by them.",
        "Then earlier today, October 13, you told me they were okay with it, although still skeptical about me choosing you immediately.",
        "After months, even years, I was accepted by the family of someone I adore so much.",
        "I want to tell you that I am willing to wait, it may only be in words, but I will be doing my best to make you feel that youre loved."
      ],
      signature: "Forever yours, Rein"
    };
  }

    const input = document.getElementById('username');
    const error = document.getElementById('error');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    const letterHeading = document.getElementById('letterHeading');
    const letterBody = document.getElementById('letterBody');
    const letterSignature = document.getElementById('letterSignature');

    function showLetter(letter) {
      letterHeading.textContent = letter.heading;
      letterBody.innerHTML = letter.paragraphs.map(p => `<p>${p}</p>`).join('');
      letterSignature.textContent = letter.signature;
      overlay.classList.add('show');
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        const music = document.getElementById('music');
        const value = input.value.trim().toLowerCase();
        const letter = LETTER[value];
        if (letter) {
          error.classList.remove('show');
          showLetter(letter);
          music.play().catch(() => { });
        } else {
          error.classList.add('show');
        }
      }
    });

    input.addEventListener('input', function () {
      error.classList.remove('show');
    });

    closeBtn.addEventListener('click', function () {
      overlay.classList.remove('show');
      input.value = '';
    });

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        overlay.classList.remove('show');
        input.value = '';
      }
    });
  </script>

</body>

</html>
